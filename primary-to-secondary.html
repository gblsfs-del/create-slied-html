<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จากเด็กประถม สู่ก้าวแรกของมัธยม</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pri:#40362F;--acc:#C89B6D;--bg:#FFFFFF;--soft:#FFF1F7;--tint:#F5EBDF}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--soft);font-family:'Kanit',sans-serif;color:var(--pri)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;position:relative;flex:none;transform-origin:center center}
.slide{position:absolute;inset:0;background:var(--bg);border-radius:36px;box-shadow:0 10px 40px rgba(64,54,47,.10);padding:56px 72px;display:none;flex-direction:column}
.slide.active{display:flex}
.tag{position:absolute;top:30px;left:40px;background:var(--pri);color:#fff;font-size:18px;font-weight:500;padding:6px 20px;border-radius:99px}
.pg{position:absolute;bottom:26px;right:44px;font-size:20px;font-weight:500;color:var(--acc)}
h1,h2{font-weight:800;line-height:1.25}
h2{font-size:54px;margin-top:34px}
.g{background:linear-gradient(90deg,var(--pri),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;gap:28px;margin-top:34px;flex:1;margin-bottom:30px}
.card{flex:1;border-radius:28px;padding:32px 30px;display:flex;flex-direction:column;gap:16px;opacity:0}
.slide.active .card{animation:up .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.28s + .1s)}
@keyframes up{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
.dark{background:var(--pri);color:#fff}
.mid{background:var(--acc);color:#fff}
.light{background:var(--tint);color:var(--pri)}
.ic{width:72px;height:72px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;transition:transform .25s;flex:none}
.dark .ic{background:var(--acc)}.mid .ic{background:var(--pri)}
.ic:hover,.card:hover .ic{transform:scale(1.14)}
.ic svg{width:36px;height:36px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:32px;font-weight:700;line-height:1.3}
.card p{font-size:23px;font-weight:300;line-height:1.5}
.hero{justify-content:center;align-items:flex-start}
.hero h1{font-size:76px;margin:22px 0 18px}
.hero .by{font-size:28px;font-weight:400}
.hero .by b{font-weight:600}
.bigic{position:absolute;right:80px;top:50%;transform:translateY(-50%);width:300px;height:300px;border-radius:50%;background:var(--pri);display:flex;align-items:center;justify-content:center;opacity:0}
.slide.active .bigic{animation:up .8s .5s forwards}
.bigic svg{width:150px;height:150px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
.bigic:hover svg{transform:scale(1.1)}
.dot{position:absolute;right:60px;top:60px;width:90px;height:90px;border-radius:50%;background:var(--acc);opacity:.35}
.nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center}
.nav button{border:0;background:var(--pri);color:#fff;font:500 16px Kanit;padding:6px 18px;border-radius:99px;cursor:pointer}
.nav button:focus-visible{outline:3px solid var(--acc)}
@media (prefers-reduced-motion:reduce){.slide.active .card,.slide.active .bigic{animation:none;opacity:1}}
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<div class="nav"><button id="prev" aria-label="ก่อนหน้า">◀</button><button id="next" aria-label="ถัดไป">▶</button></div>
<script>
const I={
cap:'<path d="M22 10L12 5 2 10l10 5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>',
book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',
star:'<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9-6.2-3.3-6.2 3.3 1.2-6.9-5-4.9 6.9-1z"/>',
flag:'<path d="M4 22V4M4 4h13l-2 4 2 4H4"/>',
pin:'<path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
check:'<path d="M20 6L9 17l-5-5"/>',
smile:'<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>',
cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
bag:'<path d="M6 8a6 6 0 0 1 12 0v13H6z"/><path d="M9 14h6M9 21v-4h6v4"/>',
msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v11h14V10"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
};
const ic=n=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;
const S=[
{hero:1,tag:'เริ่มต้น',t:'จากเด็กประถม',g:'สู่ก้าวแรกของมัธยม',by:'นำเสนอโดย <b>นางสาวฟีรดาวน์ สาแม</b>',icon:'cap'},
{tag:'วันนี้คุยอะไรกัน',t:'ก้าวใหม่ มีอะไร',g:'รออยู่บ้างนะ?',cards:[
 ['book','สิ่งที่เปลี่ยนไป','เรียนอะไรใหม่ ๆ ครูและเพื่อนเป็นอย่างไร','dark'],
 ['clock','วิธีรับมือ','จัดเวลา ดูแลตัวเอง ทำการบ้านให้ไหว','light'],
 ['flag','เตรียมตัวตั้งแต่วันนี้','ทำอะไรได้บ้างก่อนเปิดเทอม','mid']]},
{tag:'สิ่งที่เปลี่ยนไป',t:'ประถม',g:'ต่างจากมัธยมยังไง?',cards:[
 ['home','ประถม','ครูประจำชั้นดูแลใกล้ชิด เรียนอยู่ห้องเดิมเกือบทั้งวัน','light'],
 ['bag','มัธยม','ย้ายห้องเรียนตามวิชา มีความรับผิดชอบมากขึ้น','dark']]},
{tag:'การเรียน',t:'วิชาใหม่',g:'ตารางเรียนใหม่',cards:[
 ['book','วิชาเยอะขึ้น','มีวิชาเฉพาะทาง เช่น วิทยาศาสตร์ ภาษาต่างประเทศ','dark'],
 ['cal','ตารางเรียนเปลี่ยนทุกคาบ','จดตารางไว้ แล้วจัดกระเป๋าคืนก่อนนอน','light'],
 ['pen','งานและสอบบ่อยขึ้น','ทบทวนทีละนิด ดีกว่าอ่านรวดเดียว','mid']]},
{tag:'ผู้คน',t:'ครูหลายท่าน',g:'เพื่อนใหม่เพียบ',cards:[
 ['users','ครูแต่ละวิชา','แต่ละท่านสอนไม่เหมือนกัน ลองปรับตัวไปทีละวิชา','dark'],
 ['msg','กล้าถามเสมอ','ไม่เข้าใจตรงไหน ยกมือถามได้เลย ไม่มีใครว่า','light'],
 ['smile','ทักเพื่อนก่อน','ยิ้มและทักทาย มิตรภาพก็เริ่มต้นได้','mid']]},
{tag:'ความรับผิดชอบ',t:'ดูแลตัวเอง',g:'ให้เก่งขึ้นทุกวัน',cards:[
 ['bag','จัดของเอง','เตรียมหนังสือ อุปกรณ์ และชุดให้พร้อมทุกวัน','dark'],
 ['pin','รู้เส้นทาง','จำห้องเรียน ห้องน้ำ โรงอาหารให้ได้','light'],
 ['heart','กินดี นอนพอ','ร่างกายพร้อม สมองก็พร้อมเรียน','mid']]},
{tag:'บริหารเวลา',t:'จัดเวลาให้เป็น',g:'ชีวิตไม่เหนื่อย',cards:[
 ['check','ทำการบ้านทันที','ทำให้เสร็จวันนั้น ไม่ต้องกองสะสม','dark'],
 ['cal','ใช้สมุดจดงาน','จดวันส่งงานและวันสอบไว้ที่เดียว','light'],
 ['sun','เหลือเวลาพักผ่อน','เล่น พัก และทำสิ่งที่ชอบได้เต็มที่','mid']]},
{tag:'ความรู้สึก',t:'ตื่นเต้นหรือกังวล',g:'เป็นเรื่องปกติ',cards:[
 ['heart','ทุกคนรู้สึกเหมือนกัน','เพื่อนอีกหลายคนก็กำลังคิดเหมือนเรา','dark'],
 ['msg','เล่าให้คนที่ไว้ใจฟัง','พ่อแม่ ครู หรือเพื่อน พร้อมรับฟัง','light'],
 ['star','ค่อย ๆ ปรับตัว','สัปดาห์แรกอาจงง แต่เดี๋ยวก็คุ้นเคย','mid']]},
{tag:'เตรียมตัว',t:'ปิดเทอมนี้',g:'ทำอะไรได้บ้าง?',cards:[
 ['book','ทบทวนพื้นฐาน','อ่าน เขียน และคิดเลขให้คล่อง','dark'],
 ['clock','ตื่นนอนเป็นเวลา','ฝึกนิสัยตื่นเช้าก่อนวันเปิดเรียน','light'],
 ['users','คุยกับรุ่นพี่','ถามประสบการณ์จริงจากคนที่ผ่านมาแล้ว','mid']]},
{hero:1,tag:'ขอบคุณ',t:'พร้อมแล้ว',g:'ไปลุยมัธยมกัน!',by:'ขอบคุณที่ตั้งใจฟัง · <b>ครูฟีรดาวน์</b>',icon:'star'}
];
const st=document.getElementById('stage');
S.forEach((s,k)=>{
 const d=document.createElement('section');d.className='slide'+(s.hero?' hero':'');
 let h=`<div class="tag">${s.tag}</div><div class="pg">${k+1} / ${S.length}</div>`;
 if(s.hero){h+=`<div class="dot"></div><h1>${s.t}<br><span class="g">${s.g}</span></h1><div class="by">${s.by}</div><div class="bigic">${ic(s.icon)}</div>`}
 else{h+=`<h2>${s.t} <span class="g">${s.g}</span></h2><div class="row">`+
  s.cards.map((c,i)=>`<div class="card ${c[3]}" style="--i:${i}"><div class="ic">${ic(c[0])}</div><h3>${c[1]}</h3><p>${c[2]}</p></div>`).join('')+'</div>'}
 d.innerHTML=h;st.appendChild(d)});
const sl=[...document.querySelectorAll('.slide')];let cur=0;
function go(n){cur=Math.max(0,Math.min(sl.length-1,n));sl.forEach((e,i)=>e.classList.toggle('active',i===cur));location.hash=cur+1}
function fit(){st.style.transform=`scale(${Math.min(innerWidth/1280,(innerHeight-40)/720)*.96})`}
addEventListener('resize',fit);fit();
addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key))go(cur+1);if(['ArrowLeft','PageUp'].includes(e.key))go(cur-1)});
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
st.addEventListener('click',e=>{if(!e.target.closest('.ic,.bigic'))go(cur+1)});
go((parseInt(location.hash.slice(1))||1)-1);
</script>
</body>
</html>
